<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
    <meta charset="utf-8">
    <title>Vditor Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./dist/index.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #vditor {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        /* 右键菜单样式（与内置 contextMenu.ts 的类名匹配） */
        .vditor-contextmenu {
            position: fixed;
            z-index: 99999;
            min-width: 200px;
            max-width: 280px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.06);
            padding: 4px 0;
            font-size: 13px;
            line-height: 1.5;
            color: #1f2937;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            transition: opacity 0.12s ease, transform 0.12s ease;
        }
        .vditor-contextmenu--visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .vditor-contextmenu__item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px;
            cursor: pointer;
            transition: background 0.1s;
            white-space: nowrap;
        }
        .vditor-contextmenu__item:hover {
            background: #f3f4f6;
        }
        .vditor-contextmenu__item-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: #6b7280;
            font-size: 14px;
        }
        .vditor-contextmenu__item-label {
            flex: 1;
        }
        .vditor-contextmenu__item-shortcut {
            color: #9ca3af;
            font-size: 12px;
            margin-left: 16px;
        }
        .vditor-contextmenu__divider {
            height: 1px;
            background: #e5e7eb;
            margin: 4px 0;
        }
        .vditor-contextmenu__group-label {
            padding: 4px 16px 2px;
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <div id="vditor"></div>
    <script src="./dist/index.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            try {
                var vditor = new Vditor("vditor", {
                    height: 600,
                    outline: { enable: true },
                    cache: { enable: false },
                    cdn: ".",
                    mode:"wysiwyg",
                    value: "# Hello Vditor\n\n这是一个 **Vditor** 示例页面。\n\n## 功能演示\n\n- **粗体** / *斜体* / ~~删除线~~\n- `行内代码`\n- [链接](https://github.com)\n\n```javascript\nconsole.log('Hello World');\n```\n\n> 引用内容\n\n| 列1 | 列2 | 列3 |\n|-----|-----|-----|\n| A   | B   | C   |\n",
                });
            } catch(e) {
                console.error("Vditor init error:", e);
                document.getElementById("vditor").innerHTML = "<p style='color:red;padding:20px'>初始化失败: " + e.message + "</p>";
            }
        });
    </script>
</body>

</html>
