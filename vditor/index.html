<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
    <meta charset="utf-8">
    <title>Vditor Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./dist/index.css">
    <link rel="stylesheet" href="vditorProFunc.css">
    <!-- 用打包后的 UMD 暴露 window.Vditor（含静态方法 window.Vditor.mathRender），
         必须在 vditorProFunc.js 之前加载，否则 new Vditor(...) 会找不到全局。 -->
    <script src="./dist/index.min.js"></script>
    <!-- 子资源 CDN 根：mathRender 据此拼 `${cdn}/dist/js/mathjax/tex-svg-full.js`。
         vditorProFunc.js 把 mergedOptions.cdn 透传下去，必须在它之前设好，
         否则 Object.assign({}, defaultOptions, { cdn: undefined }) 会把默认 CDN 覆盖成 undefined。 -->
    <script>
        window.cdn = "https://cdn.linlifei.top/d/cdn/vditor";
        window.editorToolbar = true;
        window.mode = "wysiwyg";
    </script>
    <script src="./latexEditor/sdk.js"></script>
    <script src="vditorProFunc.js"></script>
</head>

<body>
    <div id="vditor"></div>

    <!-- LatexEasy SDK（iframe/postMessage 通信封装）。需在 Vditor 初始化前加载，
         否则模块脚本里就拿不到 window.LatexEasy。 -->

    <!-- ===== LatexEasy 公式编辑器弹窗（默认隐藏） ===== -->
    <div class="latex-modal-mask" id="latexModal" role="dialog" aria-modal="true" aria-label="LatexEasy 公式编辑器">
        <div class="latex-modal">
            <div class="latex-modal__header">
                <span>公式编辑器（LatexEasy）</span>
                <span class="latex-modal__header-hint" id="latexModalHint">编辑完成后选择插入方式</span>
            </div>
            <div class="latex-modal__body">
                <iframe class="latex-modal__iframe" id="latexModalIframe"
                        src="./latexEditor/latexEditor.html"
                        title="LatexEasy"></iframe>
            </div>
            <div class="latex-modal__footer">
                <span class="latex-modal__spacer"></span>
                <span class="latex-modal__footer-hint" id="latexModalModeHint"></span>
                <button class="latex-modal__btn" id="latexModalCancel" type="button">取消</button>
                <!-- insert 模式专用：把公式写到光标处 -->
                <button class="latex-modal__btn latex-modal__btn--code" id="latexModalInsertCode" type="button">插入为行间公式</button>
                <button class="latex-modal__btn latex-modal__btn--primary" id="latexModalInsertInline" type="button">插入为行内公式</button>
                <!-- replace 模式专用：把新 LaTeX 回写到原公式位置 -->
                <button class="latex-modal__btn latex-modal__btn--primary" id="latexModalSave" type="button" style="display:none">保存</button>
            </div>
        </div>
    </div>

</body>

</html>
